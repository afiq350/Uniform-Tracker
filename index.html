
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Tracker | Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: #F3F4F6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
            border-top: 5px solid #991B1B;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .system-title {
            color: #991B1B;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .system-subtitle {
            color: #6B7280;
            font-size: 13px;
            margin-bottom: 0;
        }

        .section-title {
            color: #1F2937;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .section-description {
            color: #6B7280;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-label {
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 46px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #991B1B;
            box-shadow: 0 0 0 0.2rem rgba(153, 27, 27, 0.12);
        }

        .input-group-text {
            background: #F9FAFB;
            border: 1px solid #D1D5DB;
            color: #6B7280;
        }

        .password-toggle {
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            min-height: 46px;
            background: #991B1B;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .btn-login:hover {
            background: #7F1D1D;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .login-footer {
            text-align: center;
            color: #9CA3AF;
            font-size: 12px;
            margin-top: 25px;
        }

        #loginError {
            display: none;
            font-size: 13px;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            .system-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Logo and System Information -->
            <div class="logo-container">

                <img
                    src="assets/logo.png"
                    alt="Uniform Tracker Logo"
                    onerror="this.style.display='none';"
                >

                <h1 class="system-title">UNIFORM TRACKER</h1>

                <p class="system-subtitle">
                    Uniform Management System
                </p>

            </div>

            <!-- Login Form -->
            <div>

                <h2 class="section-title">Welcome Back</h2>

                <p class="section-description">
                    Sign in to access your account.
                </p>

                <div id="loginError" class="alert alert-danger" role="alert">
                </div>

                <form id="loginForm">

                    <!-- User ID -->
                    <div class="mb-3">

                        <label for="username" class="form-label">
                            User ID
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-solid fa-id-card"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Enter your 10-digit ID"
                                maxlength="10"
                                inputmode="numeric"
                                pattern="[0-9]{10}"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>

                    <!-- Password -->
                    <div class="mb-4">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <span
                                class="input-group-text password-toggle"
                                id="togglePassword"
                                role="button"
                                title="Show or hide password"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </span>

                        </div>

                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-login">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>
                        Sign In
                    </button>

                </form>

            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p class="mb-1">
                    Uniform Tracker Management System
                </p>

                <p class="mb-0">
                    &copy; 2026 All Rights Reserved
                </p>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Authentication JS -->
    <script src="js/auth.js"></script>

</body>
</html>
